name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess -d chess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "False"
      DATABASE_URL: postgres://chess:chess@localhost:5432/chess

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formatacao
        run: ruff format --check .

      - name: Django check
        run: python manage.py check

      - name: Migracoes em dia com os models
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: python manage.py test
